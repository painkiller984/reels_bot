services:
  - type: web
    name: reels-bot
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && node dist/src/main.js
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_RECOVER_PRODUCTION
        value: true
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reels-bot-db
          property: connectionString
      - key: ARTIFACTS_DIR
        value: /app/artifacts
      - key: OBJECT_STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: reels-bot-anton-media
      - key: R2_SIGNED_URL_TTL_SEC
        value: 3600
      - key: MEDIA_MODE
        value: local
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: FFPROBE_PATH
        value: ffprobe
      - key: SCRIPT_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: google/gemini-3.5-flash-lite
      - key: BROLL_PROVIDER
        value: openrouter
      - key: OPENROUTER_IMAGE_MODEL
        value: google/gemini-3.1-flash-lite-image
      - key: OPENROUTER_BROLL_COUNT
        value: 2
      - key: OPENROUTER_IMAGE_ESTIMATED_COST_USD
        value: 0.0336
      - key: OPENROUTER_BROLL_MAX_COST_USD
        value: 0.08
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: TTS_PROVIDER
        value: heygen
      - key: HEYGEN_RESOLUTION
        value: 720p
      - key: HEYGEN_ENGINE
        value: avatar_iv
      - key: HEYGEN_ASPECT_RATIO
        value: 9:16
      - key: YOUTUBE_PRIVACY_STATUS
        value: public
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: HEYGEN_DEFAULT_AVATAR_ID
        sync: false
      - key: HEYGEN_VOICE_ID
        sync: false
      - key: HEYGEN_MAX_ESTIMATED_JOB_COST_USD
        value: 3

databases:
  - name: reels-bot-db
    databaseName: reels_bot
    user: reels_bot
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
