services:
  - type: web
    name: reels-bot
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reels-bot-db
          property: connectionString
      - key: ARTIFACTS_DIR
        value: /app/artifacts
      - key: MEDIA_MODE
        value: local
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: FFPROBE_PATH
        value: ffprobe
      - key: SCRIPT_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: TTS_PROVIDER
        value: heygen
      - key: HEYGEN_RESOLUTION
        value: 720p
      - key: HEYGEN_ASPECT_RATIO
        value: 9:16
      - key: YOUTUBE_PRIVACY_STATUS
        value: private
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false

databases:
  - name: reels-bot-db
    databaseName: reels_bot
    user: reels_bot
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
